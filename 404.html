<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>404 · Страница не найдена</title>
    
    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="https://i.pinimg.com/280x280_RS/f2/0a/17/f20a1738866cab48647ec757ef4e18cd.jpg" type="image/jpeg" />
    <link rel="shortcut icon" href="https://i.pinimg.com/280x280_RS/f2/0a/17/f20a1738866cab48647ec757ef4e18cd.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="https://i.pinimg.com/280x280_RS/f2/0a/17/f20a1738866cab48647ec757ef4e18cd.jpg" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FF88C2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }
        .container {
            max-width: 580px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 32px 24px 36px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2), 0 4px 12px rgba(0,0,0,0.04);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            text-align: center;
        }
        .container:hover {
            box-shadow: 0 28px 48px -16px rgba(0,0,0,0.25);
        }

        /* ===== АНИМАЦИИ ПОЯВЛЕНИЯ ===== */
        .fade-item {
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity;
        }
        .fade-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .fade-item:nth-child(1) { transition-delay: 0.03s; }
        .fade-item:nth-child(2) { transition-delay: 0.08s; }
        .fade-item:nth-child(3) { transition-delay: 0.13s; }

        /* ===== 404 ===== */
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #FF88C2;
            line-height: 1;
            letter-spacing: -4px;
            margin-bottom: 4px;
            text-shadow: 0 4px 20px rgba(255, 136, 194, 0.2);
        }
        .error-text {
            font-size: 48px;
            font-weight: 700;
            color: #111;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .error-image-wrapper {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 24px;
            border-radius: 20px;
            overflow: hidden;
            background: #f6f6f8;
            border: 1px solid #ececee;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .error-image-wrapper:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(0,0,0,0.06);
        }
        .error-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .error-desc {
            font-size: 18px;
            color: #444;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: #FF88C2;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            border-radius: 60px;
            transition: background 0.25s, transform 0.25s, box-shadow 0.3s;
            box-shadow: 0 6px 20px rgba(255, 136, 194, 0.3);
        }
        .btn-home:hover {
            background: #e970a8;
            transform: scale(1.04);
            box-shadow: 0 10px 28px rgba(255, 136, 194, 0.4);
        }
        .btn-home:active {
            transform: scale(0.96);
        }
        .btn-home i {
            font-size: 20px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 500px) {
            body { padding: 12px; }
            .container { padding: 24px 16px 28px; border-radius: 24px; }
            .error-code { font-size: 80px; }
            .error-text { font-size: 34px; }
            .error-image-wrapper { max-width: 240px; }
            .error-desc { font-size: 16px; }
            .btn-home { font-size: 16px; padding: 12px 28px; }
        }
        @media (max-width: 400px) {
            .error-code { font-size: 64px; }
            .error-text { font-size: 28px; }
            .error-image-wrapper { max-width: 200px; }
            .btn-home { font-size: 14px; padding: 10px 22px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== 404 ===== -->
    <div class="error-code fade-item visible">404</div>
    <div class="error-text fade-item">Нет</div>

    <!-- ===== КАРТИНКА ===== -->
    <div class="error-image-wrapper fade-item">
        <img 
            src="https://raw.githubusercontent.com/existentialmemes/existentialmemes.github.io/refs/heads/main/FirkRAVjZHLjabsdM9P2gQVg2qoAdUPpFT3g5AaZj51nJwkpitc79Kq6cufrehNPOyZf5KCNrU33Zfy5lo_aYGMV.jpg" 
            alt="404" loading="lazy"
        />
    </div>

    <!-- ===== КНОПКА НА ГЛАВНУЮ ===== -->
    <div class="fade-item">
        <a href="/" class="btn-home">
            <i class="fas fa-home"></i> На главную
        </a>
    </div>

</div>

<script>
    // ===== АНИМАЦИЯ ПРИ ЗАГРУЗКЕ =====
    (function() {
        const fadeItems = document.querySelectorAll('.fade-item:not(.visible)');
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: '0px 0px -30px 0px'
            });
            fadeItems.forEach(el => observer.observe(el));
        } else {
            fadeItems.forEach(el => el.classList.add('visible'));
        }
    })();
</script>

</body>
</html>
