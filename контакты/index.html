<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Контакты · Экзистенциальные мемы</title>
    
    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="https://i.pinimg.com/280x280_RS/f2/0a/17/f20a1738866cab48647ec757ef4e18cd.jpg" type="image/jpeg" />
    <link rel="shortcut icon" href="https://i.pinimg.com/280x280_RS/f2/0a/17/f20a1738866cab48647ec757ef4e18cd.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="https://i.pinimg.com/280x280_RS/f2/0a/17/f20a1738866cab48647ec757ef4e18cd.jpg" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FF88C2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }
        .container {
            max-width: 580px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2), 0 4px 12px rgba(0,0,0,0.04);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            backdrop-filter: blur(2px);
        }
        .container:hover {
            box-shadow: 0 28px 48px -16px rgba(0,0,0,0.25);
        }

        /* ===== АНИМАЦИИ ПОЯВЛЕНИЯ ===== */
        .fade-item {
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity;
        }
        .fade-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .fade-item:nth-child(1) { transition-delay: 0.03s; }
        .fade-item:nth-child(2) { transition-delay: 0.08s; }
        .fade-item:nth-child(3) { transition-delay: 0.13s; }
        .fade-item:nth-child(4) { transition-delay: 0.18s; }
        .fade-item:nth-child(5) { transition-delay: 0.23s; }
        .fade-item:nth-child(6) { transition-delay: 0.28s; }
        .fade-item:nth-child(7) { transition-delay: 0.33s; }
        .fade-item:nth-child(8) { transition-delay: 0.38s; }
        .fade-item:nth-child(9) { transition-delay: 0.43s; }
        .fade-item:nth-child(10) { transition-delay: 0.48s; }

        /* ===== ШАПКА С КНОПКОЙ НАЗАД ===== */
        .page-header {
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(240, 224, 232, 0.6);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .page-header .back-link {
            font-size: 24px;
            color: #111;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #f0f0f2;
            transition: background 0.2s, transform 0.2s, color 0.2s;
            flex-shrink: 0;
        }
        .page-header .back-link:hover {
            background: #e4e4e8;
            color: #FF88C2;
            transform: scale(1.06);
        }
        .page-header .back-link i {
            font-size: 22px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: #111;
            line-height: 1.2;
            flex: 1;
        }

        /* ===== КОНТАКТЫ ===== */
        .contacts-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }
        .contact-item {
            background: #f6f6f8;
            border-radius: 18px;
            border: 1px solid #ececee;
            overflow: hidden;
            transition: background 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
        }
        .contact-item:hover {
            background: #ededf0;
            transform: translateY(-2px) scale(1.008);
            box-shadow: 0 8px 18px rgba(0,0,0,0.04);
        }
        .contact-item a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            color: #111;
            text-decoration: none;
            font-size: 19px;
            font-weight: 500;
        }
        .contact-item a i {
            font-size: 28px;
            width: 36px;
            text-align: center;
            color: #FF88C2;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }
        .contact-item:hover a i {
            transform: scale(1.12);
        }
        .contact-item .contact-label {
            flex: 1;
        }
        .contact-item .contact-arrow {
            color: #999;
            font-size: 18px;
            transition: transform 0.2s ease;
        }
        .contact-item:hover .contact-arrow {
            transform: translateX(4px);
            color: #FF88C2;
        }

        /* ===== КНОПКА НАЗАД (внизу) ===== */
        .nav-back {
            text-align: center;
            margin-top: 4px;
        }
        .nav-back a {
            display: inline-block;
            padding: 12px 28px;
            background: #f0f0f2;
            border-radius: 40px;
            color: #111;
            text-decoration: none;
            font-weight: 500;
            border: 1px solid #e4e4e6;
            transition: background 0.2s, transform 0.2s;
        }
        .nav-back a:hover {
            background: #e4e4e8;
            transform: scale(1.02);
        }
        .nav-back a i {
            margin-right: 8px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 500px) {
            body { padding: 12px; }
            .container { padding: 18px 14px 24px; border-radius: 24px; }
            .page-header h1 { font-size: 22px; }
            .page-header .back-link { width: 38px; height: 38px; font-size: 20px; }
            .page-header .back-link i { font-size: 18px; }
            .contact-item a { font-size: 17px; padding: 14px 16px; }
            .contact-item a i { font-size: 24px; width: 30px; }
        }
        @media (max-width: 400px) {
            .page-header h1 { font-size: 19px; }
            .contact-item a { font-size: 15px; padding: 12px 14px; }
            .contact-item a i { font-size: 20px; width: 26px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== ШАПКА С КНОПКОЙ НАЗАД ===== -->
    <div class="page-header fade-item visible">
        <a href="#" class="back-link" onclick="history.back(); return false;">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1>Контакты</h1>
    </div>

    <!-- ===== КОНТАКТЫ ===== -->
    <div class="contacts-grid">
        <div class="contact-item fade-item">
            <a href="https://vk.com/antimaslo_of" target="_blank">
                <i class="fa-brands fa-vk"></i>
                <span class="contact-label">Написать в ВК</span>
                <span class="contact-arrow"><i class="fas fa-chevron-right"></i></span>
            </a>
        </div>
        <div class="contact-item fade-item">
            <a href="https://t.me/stepa_antimaslo" target="_blank">
                <i class="fa-brands fa-telegram"></i>
                <span class="contact-label">Написать в ТГ</span>
                <span class="contact-arrow"><i class="fas fa-chevron-right"></i></span>
            </a>
        </div>
    </div>

    <!-- ===== КНОПКА ВЕРНУТЬСЯ НАЗАД ===== -->
    <div class="nav-back fade-item">
        <a href="#" onclick="history.back(); return false;">
            <i class="fas fa-arrow-left"></i> Вернуться
        </a>
    </div>

</div>

<script>
    // ===== АНИМАЦИЯ ПРИ СКРОЛЛЕ =====
    (function() {
        const fadeItems = document.querySelectorAll('.fade-item:not(.visible)');
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: '0px 0px -30px 0px'
            });
            fadeItems.forEach(el => observer.observe(el));
        } else {
            fadeItems.forEach(el => el.classList.add('visible'));
        }
    })();
</script>

</body>
</html>
